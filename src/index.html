<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' blob:; worker-src 'self' blob:; font-src 'self';"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hand Mouse Control</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="header">
            <h1>
                <span class="dot" id="statusDot"></span>
                HAND MOUSE
            </h1>
            <button class="toggle-btn" id="toggleBtn">START</button>
        </div>

        <div class="camera-select-row">
            <label for="cameraSelect">Camera</label>
            <select id="cameraSelect"></select>
        </div>

        <div class="camera-container">
            <video id="videoElement" autoplay playsinline></video>
            <canvas id="canvasOverlay"></canvas>
            <div class="camera-badge">
                <span class="rec" id="recDot" style="display: none"></span>
                <span id="camStatus">CAMERA OFF</span>
            </div>
            <div class="fps-badge" id="fpsBadge">-- FPS</div>
        </div>

        <div class="status-panel">
            <div class="gesture-grid">
                <div class="gesture-card" id="gestureMove">
                    <span class="icon">👆</span>
                    <div class="info">
                        <span class="label">Move</span>
                        <span class="desc">Left hand index</span>
                    </div>
                </div>
                <div class="gesture-card" id="gestureLeft">
                    <span class="icon">🤏</span>
                    <div class="info">
                        <span class="label">Left Click</span>
                        <span class="desc">Right: Thumb + Index</span>
                    </div>
                </div>
                <div class="gesture-card" id="gestureRight">
                    <span class="icon">👌</span>
                    <div class="info">
                        <span class="label">Right Click</span>
                        <span class="desc">Right: Thumb + Middle</span>
                    </div>
                </div>
                <div class="gesture-card" id="gestureScroll">
                    <span class="icon">📜</span>
                    <div class="info">
                        <span class="label">Scroll</span>
                        <span class="desc">Right: Thumb + Ring</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="settings">
            <div class="setting-row">
                <span class="setting-label">Sensitivity</span>
                <input
                    type="range"
                    id="sensitivity"
                    min="1"
                    max="5"
                    step="0.5"
                    value="2"
                />
                <span class="setting-value" id="sensitivityVal">2.0</span>
            </div>
            <div class="setting-row">
                <span class="setting-label">Smoothing</span>
                <input
                    type="range"
                    id="smoothing"
                    min="1"
                    max="10"
                    step="1"
                    value="5"
                />
                <span class="setting-value" id="smoothingVal">5</span>
            </div>
            <div class="setting-row">
                <span class="setting-label">Pinch Threshold</span>
                <input
                    type="range"
                    id="threshold"
                    min="20"
                    max="80"
                    step="5"
                    value="45"
                />
                <span class="setting-value" id="thresholdVal">45</span>
            </div>
        </div>

        <div class="log-panel" id="logPanel">
            <div>[ SYSTEM ] Hand Mouse Control v1.0 ready</div>
        </div>

        <script src="vendor/mediapipe/camera_utils.js"></script>
        <script src="vendor/mediapipe/drawing_utils.js"></script>
        <script src="vendor/mediapipe/hands.js"></script>
        <script defer src="renderer.js"></script>
    </body>
</html>
